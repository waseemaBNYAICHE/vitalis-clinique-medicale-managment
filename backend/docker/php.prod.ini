; Production PHP settings for the Laravel container.
memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 32M
post_max_size = 32M
date.timezone = UTC

; Errors are logged, never returned to the client: a stack trace in a response
; leaks paths, queries and configuration.
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On
error_log = /dev/stderr

expose_php = Off

; The code never changes inside a released image, so opcache does not need to
; stat files on every request.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

realpath_cache_size = 4096K
realpath_cache_ttl = 600
