name: ${COMPOSE_PROJECT_NAME:-anas}

# `app` and `queue` run the same codebase from the same image; sharing these
# fragments keeps them from drifting apart when one of them is edited.
x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile
  args:
    UID: ${UID:-1000}
    GID: ${GID:-1000}

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_URL: http://localhost:${NGINX_PORT:-8000}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-laravel}
  DB_USERNAME: ${DB_USERNAME:-laravel}
  DB_PASSWORD: ${DB_PASSWORD:-secret}
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis

services:
  # ---------------------------------------------------------------- PostgreSQL
  # Internal only: no `ports:` mapping, so it is unreachable from the host.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-laravel} -d ${DB_DATABASE:-laravel}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend

  # --------------------------------------------------------------------- Redis
  # Cache + sessions + queues. Internal only.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - backend

  # ------------------------------------------------------------ Laravel (fpm)
  app:
    # Explicit shared tag: `app` and `queue` build an identical image, and
    # without it Compose produces (and exports) two separate ones.
    image: ${COMPOSE_PROJECT_NAME:-anas}-backend
    build: *backend-build
    restart: unless-stopped
    environment:
      <<: *backend-env
      CONTAINER_ROLE: app
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      FRONTEND_URL: http://localhost:${VITE_PORT:-5173}
    volumes:
      - ./backend:/var/www/html
      # Keep container-managed dependencies out of the host bind mount.
      - backend-vendor:/var/www/html/vendor
    expose:
      - "9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    networks:
      - backend

  # ------------------------------------------------------- Laravel queue worker
  queue:
    image: ${COMPOSE_PROJECT_NAME:-anas}-backend
    build: *backend-build
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--sleep=3", "--max-time=3600"]
    environment:
      <<: *backend-env
      CONTAINER_ROLE: queue
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  # ------------------------------------------------------- Nginx (public API)
  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8000}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/upstream.conf:/etc/nginx/conf.d/upstream.conf:ro
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    networks:
      - backend

  # ------------------------------------------------------ Vue + Vite dev server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      # Named volume so host node_modules never shadows the container's.
      - frontend-node-modules:/app/node_modules
    depends_on:
      nginx:
        condition: service_started
    # Liveness only: this proves the Vite server answers, not that the app
    # compiles. A node_modules volume left behind by a dependency change still
    # reports healthy while module resolution fails in the browser. Rebuild with
    # `docker compose up -d --build` after pulling a package.json change.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - backend

volumes:
  postgres-data:
  redis-data:
  frontend-node-modules:
  backend-vendor:

networks:
  backend:
    driver: bridge
