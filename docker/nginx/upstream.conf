# A named `upstream` block resolves its servers once, when nginx starts. When the
# `app` container was recreated with a different IP, nginx kept forwarding to the
# old address and every request returned 502 until nginx itself was restarted.
#
# Pointing fastcgi_pass at a variable instead defers resolution to request time,
# through Docker's embedded DNS server on 127.0.0.11.
resolver 127.0.0.11 valid=10s ipv6=off;
