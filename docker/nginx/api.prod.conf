# Production front for the Laravel API.
#
# The backend is API-only and its source lives inside the app image, not on a
# shared volume, so nginx has no filesystem to serve from: every request is
# handed straight to php-fpm. Static assets belong to the frontend image.
server {
    listen 80;
    server_name _;

    charset utf-8;
    client_max_body_size 32m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Resolve the app container at request time; a named upstream would cache
    # the address it saw at startup and answer 502 after the app is replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $php_upstream app:9000;

        include fastcgi_params;
        fastcgi_pass $php_upstream;

        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;

        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
    }

    access_log /var/log/nginx/api-access.log;
    error_log  /var/log/nginx/api-error.log warn;
}
